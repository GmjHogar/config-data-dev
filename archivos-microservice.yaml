server:
  port: 8008
spring:
  datasource:
    url: jdbc:mysql://192.168.1.171:3306/archivos_microservice?allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000
    username: admin
    password: admin
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate.ddl-auto: update
    generate-ddl: false
    show-sql: false

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url.defaultZone: http://192.168.1.241:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile

jwt:
  secret: electrohogarl
administration:
  microservice:
    url: http://192.168.1.171:8003/api/v1/roles
auth:
  microservice:
    url: http://192.168.1.171:8001/api/v1
clientes:
  microservice:
    url: http://192.168.1.171:8004/api/v1

user:
  microservice:
    url: http://192.168.1.171:8002/api/v1/users

cartera:
  microservice:
    url: http://192.168.1.171:8006/api/v1/cartera
url:
  ruta:
    archivos: /data/uploads/archivos-microservice
