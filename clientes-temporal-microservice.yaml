server:
  port: 8020

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:host-gateway:3306/clientes-temporal
    username: electrohogar
    password: GmjHog@r.2026*

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: false

  http:
    encoding:
      charset: UTF-8
      force: true

  messages:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30

auth:
  microservice:
    url: http://auth-microservice:8001/api/v1

user:
  microservice:
    url: http://user-microservice:8002/api/v1/users

administration:
  microservice:
    url: http://administration-microservice:8003/api/v1/roles