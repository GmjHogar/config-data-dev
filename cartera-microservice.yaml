server:
  port: 8006

spring:
  datasource:
    url: jdbc:mysql://172.18.0.1:3306:3306/cartera_microservice?allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000
    username: electrohogar
    password: GmjHog@r.2026*
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: false
  http:
    encoding:
      charset: UTF-8
      force: true
  messages:
    encoding: UTF-8

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-microservice:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile

jwt:
  secret: electrohogarl

administration:
  microservice:
    url: http://administration-microservice:8003/api/v1/roles

user:
  microservice:
    url: http://user-microservice:8002/api/v1/users

auth:
  microservice:
    url: http://auth-microservice:8001/api/v1

clientes:
  microservice:
    url: http://clientes-microservice:8004/api/v1