server:
  port: 8004

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:host-gateway:3306/clientes-microservice
    username: electrohogar
    password: GmjHog@r.2026*

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-microservice:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30

user:
  microservice:
    url: http://user-microservice:8002/api/v1/users

auth:
  microservice:
    url: http://auth-microservice:8001/api/v1

administration:
  microservice:
    url: http://administration-microservice:8003/api/v1/roles